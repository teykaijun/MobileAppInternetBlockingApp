name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/InternetBlocker-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: internet-blocker-apk
          path: artifacts/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.apk \
            --title "Internet Blocker $GITHUB_REF_NAME" \
            --notes "Debug-signed APK built from ${GITHUB_SHA}.

          Install with \`adb install -r <file>\`, or open the APK on the phone and allow installs from that source."
